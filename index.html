<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1d23" media="(prefers-color-scheme: dark)">
<meta name="app-version" content="0.1.1-1105b">
<title>약국 임장노트</title>
<link rel="stylesheet" href="./fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="./css/app.css?v=0.1.1-1105b">
<script type="importmap">
{
  "imports": {
    "./js/config.js": "./js/config.js?v=0.1.1-1105b",
    "./js/lib/device.js": "./js/lib/device.js?v=0.1.1-1105b",
    "./js/lib/format.js": "./js/lib/format.js?v=0.1.1-1105b",
    "./js/lib/messages.js": "./js/lib/messages.js?v=0.1.1-1105b",
    "./js/lib/store.js": "./js/lib/store.js?v=0.1.1-1105b"
  }
}
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M12 2.5c-4.1 0-7.5 3.2-7.5 7.3 0 5.3 6.4 11.1 6.7 11.4.4.4 1.1.4 1.5 0 .3-.3 6.8-6.1 6.8-11.4 0-4.1-3.4-7.3-7.5-7.3z" fill="currentColor"/>
        <path d="M10.6 6.2h2.8v2.6H16v2.8h-2.6v2.6h-2.8v-2.6H8V8.8h2.6z" fill="var(--surface)"/>
      </svg>
      <span>약국 임장노트</span>
    </div>
    <button class="text-btn" id="topReload" type="button">다시 불러오기</button>
  </header>

  <main class="stage">
    <div id="map" role="region" aria-label="지도"></div>
    <div id="mapMsg" class="map-msg" hidden></div>
    <p id="reloadMsg" class="form-msg top-msg" role="alert" hidden></p>
    <form id="searchForm" class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="장소나 주소 검색" enterkeyhint="search" autocomplete="off" aria-label="장소나 주소 검색">
      <button type="submit" id="searchBtn">검색</button>
    </form>
    <ul id="results" class="results" hidden></ul>
    <button id="locate" class="fab" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>내 위치</span>
    </button>
  </main>

  <section class="sheet" id="sheet" data-collapsed="false">
    <button class="sheet-head" id="sheetToggle" type="button" aria-expanded="true" aria-controls="sheetBody">
      <span class="grabber" aria-hidden="true"></span>
      <span class="sheet-row">
        <span class="sheet-title">연결 점검</span>
        <span class="score" id="score" data-done="false">3개 중 0개 통과</span>
      </span>
    </button>
    <div class="sheet-body" id="sheetBody">
      <p class="lead">3개가 모두 통과하면 연결 확인이 끝나요.</p>
      <ol class="checks">
        <li class="check" data-check="map" data-state="wait"><span class="icon" aria-hidden="true"></span><div class="body"><div class="name">지도</div><p class="msg">지도를 불러오는 중이에요.</p></div><span class="state sr-only">대기</span></li>
        <li class="check" data-check="search" data-state="wait"><span class="icon" aria-hidden="true"></span><div class="body"><div class="name">장소 검색</div><p class="msg">검색창에 아무 장소나 검색해 보세요.</p></div><span class="state sr-only">대기</span></li>
        <li class="check" data-check="gps" data-state="wait"><span class="icon" aria-hidden="true"></span><div class="body"><div class="name">내 위치</div><p class="msg">'내 위치' 버튼을 눌러보세요.</p></div><span class="state sr-only">대기</span></li>
      </ol>

      <div class="foot">
        <span>버전 <span id="ver"></span></span>
      </div>
    </div>
  </section>
</div>
<script>
// 홈 화면 앱에는 새로고침 버튼이 없어서 직접 둡니다.
// 모듈(app.js)이 실패해도 이 버튼은 살아 있어야 하므로 일반 script로 연결합니다.
(function () {
  var btn = document.getElementById('topReload');
  var msg = document.getElementById('reloadMsg');
  var watchdogShown = false;
  function say(text) {
    msg.dataset.tone = 'fail';
    msg.textContent = text;
    msg.hidden = false;
  }
  async function reloadApp() {
    btn.disabled = true;
    btn.textContent = '불러오는 중…';
    msg.hidden = true;
    var ok = false;
    try {
      var c = new AbortController();
      var t = setTimeout(function () { c.abort(); }, 8000);
      var r = await fetch(location.pathname, { cache: 'reload', signal: c.signal });
      clearTimeout(t);
      ok = r.ok;
    } catch (e) { /* 아래에서 안내합니다 */ }
    if (!ok) {
      // 신호 없이 reload하면 앱 화면 대신 오류 화면만 남으니, 응답을 받았을 때만 다시 읽습니다.
      btn.disabled = false;
      btn.textContent = '다시 불러오기';
      say('인터넷이 안 잡혀요. 연결된 뒤 다시 눌러 주세요.');
      return;
    }
    if (window.__beforeReload) window.__beforeReload();
    location.reload();
  }
  btn.addEventListener('click', reloadApp);
  // 시작 감시: 모듈 하나만 실패해도 app.js 전체가 실행되지 않습니다.
  var watch = setTimeout(function () {
    if (window.__appStarted) return;
    document.getElementById('ver').textContent = document.querySelector('meta[name="app-version"]').content;
    say("앱을 불러오지 못했어요. 인터넷을 확인하고 위쪽 '다시 불러오기'를 눌러 주세요.");
    watchdogShown = true;
  }, 8000);
  window.__onAppStarted = function () {
    clearTimeout(watch);
    if (watchdogShown) msg.hidden = true;
  };
})();
</script>
<script type="module" src="./js/app.js?v=0.1.1-1105b"></script>
</body>
</html>

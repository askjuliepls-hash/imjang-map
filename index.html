<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1d23" media="(prefers-color-scheme: dark)">
<meta name="app-version" content="0.3.0-1105c">
<title>약국 임장노트</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="./css/app.css?v=0.3.0-1105c">
<script>
// 아이폰 홈 화면 앱은 위쪽 흐림 효과가 앱 글자와 겹쳐서 윗부분을 띄웁니다(css/app.css의 --top-gap).
if (window.navigator.standalone === true) document.documentElement.classList.add('ios-app');
</script>
<script type="importmap">
{
  "imports": {
    "./js/lib/categories.js": "./js/lib/categories.js?v=0.3.0-1105c",
    "./js/config.js": "./js/config.js?v=0.3.0-1105c",
    "./js/lib/device.js": "./js/lib/device.js?v=0.3.0-1105c",
    "./js/lib/format.js": "./js/lib/format.js?v=0.3.0-1105c",
    "./js/lib/listings.js": "./js/lib/listings.js?v=0.3.0-1105c",
    "./js/lib/messages.js": "./js/lib/messages.js?v=0.3.0-1105c",
    "./js/lib/places.js": "./js/lib/places.js?v=0.3.0-1105c",
    "./js/lib/store.js": "./js/lib/store.js?v=0.3.0-1105c"
  }
}
</script>
</head>
<body>
<div class="app" id="app" data-tab="map">
  <main class="stage">
    <div id="map" role="region" aria-label="지도"></div>
    <div id="mapMsg" class="map-msg" hidden></div>
    <form id="searchForm" class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="장소나 주소 검색" enterkeyhint="search" autocomplete="off" aria-label="장소나 주소 검색">
      <button class="clear-btn" id="qClear" type="button" aria-label="검색어 지우기" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </form>
    <ul id="results" class="results" hidden></ul>
    <div class="cat-chips" id="catChips" role="group" aria-label="지도에 보일 분류" hidden></div>
    <button id="locate" class="fab" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>내 위치</span>
    </button>
    <div class="notice" id="placeNotice" hidden>
      <div class="notice-head">
        <strong>여기에 저장한 내용은 홈 화면 아이콘에서 안 보여요</strong>
        <button class="clear-btn" id="noticeClose" type="button" aria-label="안내 닫기"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
      <p class="next-help" id="placeHelp"></p>
    </div>
    <div id="pinCard" class="pick-bar" hidden>
      <div class="place-info">
        <strong id="pinName"></strong>
        <span id="pinLine"></span>
      </div>
      <div class="pick-actions">
        <button class="text-btn" id="pinClose" type="button">닫기</button>
        <button class="fill-btn" id="pinOpen" type="button">자세히 보기</button>
      </div>
    </div>
    <div id="placeCard" class="pick-bar" hidden>
      <div class="place-info">
        <strong id="placeName"></strong>
        <span id="placeAddress"></span>
      </div>
      <div class="pick-actions">
        <button class="text-btn" id="placeClose" type="button">닫기</button>
        <button class="fill-btn" id="placeAdd" type="button">이 약국으로 매물 추가</button>
      </div>
    </div>
    <div id="pickBar" class="pick-bar" hidden>
      <p id="pickText">지도에서 약국 위치를 눌러 주세요.</p>
      <div class="pick-actions">
        <button class="text-btn" id="pickCancel" type="button">취소</button>
        <button class="fill-btn" id="pickOk" type="button" disabled>이 위치로 하기</button>
      </div>
    </div>
  </main>

  <section class="sheet" id="sheet">
    <div class="sheet-head">
      <span class="sheet-row">
        <span class="sheet-title">내 매물</span>
        <span class="score" id="count">0개</span>
      </span>
    </div>
    <div class="sheet-body" id="sheetBody">
      <p class="form-msg" id="loadMsg" role="alert" hidden></p>
      <p class="muted" id="empty">아직 저장한 매물이 없어요. 아래 '+ 매물 추가'로 시작해 보세요.</p>
      <div class="view-tabs" id="viewTabs" role="group" aria-label="목록 보기" hidden>
        <button type="button" data-view="date" aria-pressed="true">임장 날짜별</button>
        <button type="button" data-view="region" aria-pressed="false">지역별</button>
        <button type="button" data-view="category" aria-pressed="false">분류별</button>
      </div>
      <ul class="listings" id="list"></ul>
    </div>
  </section>

  <section class="settings" id="settingsPanel">
    <h1>설정</h1>
    <button class="set-row" id="catManage" type="button">내 분류 관리<span id="catCount"></span></button>
    <div class="set-row">백업하기<span>준비 중</span></div>
    <div class="set-row">버전<span id="ver"></span></div>
  </section>

  <button id="addBtn" class="fill-btn add-btn" type="button">+ 매물 추가</button>
  <p id="toast" class="form-msg top-msg" role="status" hidden></p>

  <nav class="tabbar" id="tabbar" aria-label="화면">
    <button class="tab" type="button" data-tab="map" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2.5c-4.1 0-7.5 3.2-7.5 7.3 0 5.3 6.4 11.1 6.7 11.4.4.4 1.1.4 1.5 0 .3-.3 6.8-6.1 6.8-11.4 0-4.1-3.4-7.3-7.5-7.3z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.8" r="2.4" fill="currentColor"/></svg>
      <span>지도</span>
    </button>
    <button class="tab" type="button" data-tab="list" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6.5 3h11A1.5 1.5 0 0 1 19 4.5v15a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.500v-15A1.500 1.500 0 0 1 6.500 3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8h6M9 12h6M9 16h3.500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>매물 목록</span>
    </button>
    <button class="tab" type="button" data-tab="settings" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/></svg>
      <span>설정</span>
    </button>
  </nav>

  <!-- 매물 양식 -->
  <div class="screen" id="formScreen" hidden>
    <header class="screen-head">
      <button class="text-btn" id="formClose" type="button">취소</button>
      <h1 id="formTitle">매물 추가</h1>
      <span class="head-gap"></span>
    </header>
    <form id="listingForm" class="screen-body" autocomplete="off" novalidate>
      <div id="formFields"></div>
      <div id="catField" class="field" hidden>
        <p class="field-label">분류</p>
        <div class="cat-choices" id="catChoices" role="group" aria-label="분류 고르기"></div>
      </div>
      <div id="locationBox" class="location" hidden>
        <div class="field">
          <label for="locQ">주소</label>
          <div id="locPick" class="loc-pick">
            <div class="loc-search">
              <input id="locQ" type="search" placeholder="주소나 장소 이름으로 찾기" enterkeyhint="search" autocomplete="off">
              <button class="text-btn" id="locSearchBtn" type="button">검색</button>
            </div>
            <ul id="locResults" class="loc-results" hidden></ul>
            <div class="loc-actions">
              <button class="text-btn" id="locMapBtn" type="button">지도에서 찾기</button>
              <button class="text-btn" id="locHereBtn" type="button">현재 위치</button>
            </div>
          </div>
          <div id="locChosen" class="loc-pick" hidden>
            <div class="with-clear">
              <input id="f-address" name="address" type="text" autocomplete="off" aria-label="주소">
              <button class="clear-btn" id="locClear" type="button" aria-label="주소 지우기"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
            </div>
          </div>
          <p class="muted" id="locState"></p>
        </div>
        <div class="field">
          <label for="f-locationMemo">상세 위치</label>
          <input id="f-locationMemo" name="locationMemo" type="text" autocomplete="off" placeholder="예: 병원 정문 건너편 1층">
        </div>
      </div>
      <div class="form-end">
        <p class="form-msg" id="formMsg" role="alert" hidden></p>
        <button class="btn primary" id="saveListing" type="submit">저장하기</button>
      </div>
    </form>
  </div>

  <!-- 매물 상세 -->
  <div class="screen" id="detailScreen" hidden>
    <header class="screen-head">
      <button class="text-btn" id="detailClose" type="button">닫기</button>
      <h1>매물 정보</h1>
      <button class="text-btn" id="mapViewBtn" type="button">지도에서 보기</button>
    </header>
    <div class="screen-body">
      <p class="detail-title" id="detailTitle"></p>
      <p class="detail-cat" id="detailCat" hidden></p>
      <div id="detailBody"></div>
      <div class="form-end">
        <p class="form-msg" id="detailMsg" role="alert" hidden></p>
        <button class="btn primary" id="editBtn" type="button">수정하기</button>
        <button class="text-btn" id="deleteBtn" type="button">삭제하기</button>
      </div>
    </div>
  </div>

  <!-- 내 분류 관리 -->
  <div class="screen" id="catScreen" hidden>
    <header class="screen-head">
      <button class="text-btn" id="catScreenClose" type="button">닫기</button>
      <h1>내 분류</h1>
      <span class="head-gap"></span>
    </header>
    <div class="screen-body">
      <p class="muted" id="catEmpty">'후보', '제외', '재방문'처럼 내가 쓰기 편한 이름으로 만들어 보세요. 분류마다 지도 핀 색이 달라져요.</p>
      <ul class="cat-list" id="catList"></ul>
      <div class="form-end">
        <button class="btn primary" id="catAdd" type="button">새 분류 만들기</button>
      </div>
    </div>
  </div>

  <!-- 분류 만들기·고치기 -->
  <div class="modal" id="catModal" role="dialog" aria-modal="true" aria-labelledby="catModalTitle" hidden>
    <div class="modal-box">
      <h2 class="modal-title" id="catModalTitle">새 분류</h2>
      <div class="field">
        <label for="catName">이름</label>
        <input id="catName" type="text" autocomplete="off" placeholder="예: 후보, 제외, 재방문">
      </div>
      <p class="field-label">핀 색</p>
      <div class="swatches" id="catSwatches" role="group" aria-label="핀 색 고르기"></div>
      <p class="field-error" id="catError" hidden></p>
      <div class="modal-actions">
        <button class="text-btn" id="catCancel" type="button">취소</button>
        <button class="fill-btn" id="catSave" type="button">저장</button>
      </div>
    </div>
  </div>

  <!-- 확인 창 -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalText" hidden>
    <div class="modal-box">
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="text-btn" id="modalNo" type="button"></button>
        <button class="text-btn danger" id="modalYes" type="button"></button>
      </div>
    </div>
  </div>
  <!-- 앱이나 지도를 불러오지 못했을 때만 보입니다 -->
  <div class="reload-box" id="reloadBox" role="alert" hidden>
    <p id="reloadMsg"></p>
    <button class="fill-btn" id="topReload" type="button">다시 불러오기</button>
  </div>
</div>
<script>
// 홈 화면 앱에는 새로고침 버튼이 없습니다. 앱이나 지도를 불러오지 못했을 때만 다시 불러오기를 보여 줍니다.
// 모듈(app.js)이 실패해도 이 버튼은 살아 있어야 하므로 일반 script로 연결합니다.
(function () {
  var box = document.getElementById('reloadBox');
  var btn = document.getElementById('topReload');
  var msg = document.getElementById('reloadMsg');
  var watchdogShown = false;
  function say(text) {
    msg.textContent = text;
    box.hidden = false;
  }
  window.__showReload = say;
  window.__hideReload = function () { box.hidden = true; };
  async function reloadApp() {
    btn.disabled = true;
    btn.textContent = '불러오는 중…';
    var ok = false;
    try {
      var c = new AbortController();
      var t = setTimeout(function () { c.abort(); }, 8000);
      var r = await fetch(location.pathname, { cache: 'reload', signal: c.signal });
      clearTimeout(t);
      ok = r.ok;
    } catch (e) { /* 아래에서 안내합니다 */ }
    if (!ok) {
      // 신호 없이 reload하면 앱 화면 대신 오류 화면만 남으니, 응답을 받았을 때만 다시 읽습니다.
      btn.disabled = false;
      btn.textContent = '다시 불러오기';
      say('인터넷이 안 잡혀요. 연결된 뒤 다시 눌러 주세요.');
      return;
    }
    location.reload();
  }
  btn.addEventListener('click', reloadApp);
  // 시작 감시: 모듈 하나만 실패해도 app.js 전체가 실행되지 않습니다.
  var watch = setTimeout(function () {
    if (window.__appStarted) return;
    document.getElementById('ver').textContent = document.querySelector('meta[name="app-version"]').content;
    say('앱을 불러오지 못했어요. 인터넷을 확인하고 눌러 주세요.');
    watchdogShown = true;
  }, 8000);
  window.__onAppStarted = function () {
    clearTimeout(watch);
    if (watchdogShown) box.hidden = true;
  };
})();
</script>
<script type="module" src="./js/app.js?v=0.3.0-1105c"></script>
</body>
</html>
